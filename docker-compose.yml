version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: switch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: paymentswitch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paymentswitch"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: switch_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/paymentswitch
      SECRET_KEY: ${SECRET_KEY:-dev-lntfintech-switch-secret-key-32-chars-min-2026}
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m app.cli seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: switch_worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/paymentswitch
      SECRET_KEY: ${SECRET_KEY:-dev-lntfintech-switch-secret-key-32-chars-min-2026}
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.cli worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: switch_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
